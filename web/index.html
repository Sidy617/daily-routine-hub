<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Simulation Routine</title>
    <meta name="description" content="Daily routine for the Simulation team: your day, your team's, and every day kept." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Paint the saved theme before anything shows, so there is no flash.
      try {
        document.documentElement.dataset.themeId = localStorage.getItem('theme') || 'meulic';
      } catch (e) {
        document.documentElement.dataset.themeId = 'meulic';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
